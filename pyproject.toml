[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "objectnav"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"hydra-core>=1.3,<1.4",
	"omegaconf>=2.3,<2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
